name: Release FoxShot

"on":
  push:
    branches:
      - main
    paths:
      - manifest.json
      - tests/smoke.mjs
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')" >> "$GITHUB_OUTPUT"

      - name: Run smoke tests
        run: npm test

      - name: Build XPI
        id: build
        run: |
          XPI="$(python3 tools/build.py)"
          python3 -m zipfile -t "$XPI"
          echo "xpi=$XPI" >> "$GITHUB_OUTPUT"

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          XPI: ${{ steps.build.outputs.xpi }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; nothing to do."
            exit 0
          fi
          gh release create "$TAG" "$XPI" --target "$GITHUB_SHA" --title "FoxShot $VERSION" --notes "FoxShot $VERSION improves long/full-page screenshot reliability with pixel-based seam alignment, better scroll-snap/sticky handling, and Firefox regression coverage for capture drift."

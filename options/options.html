<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FoxShot Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="settings-shell">
    <header class="page-header">
      <div class="brand-badge">
        <img src="../icons/icon.svg" alt="">
      </div>
      <div>
        <h1>FoxShot</h1>
        <p data-i18n="settingsSubtitle">截图设置</p>
      </div>
    </header>

    <section class="card">
      <div class="card-head">
        <h2 data-i18n="appearanceHeading">外观</h2>
      </div>
      <div class="theme-row">
        <div class="theme-copy">
          <span class="toggle-title" data-i18n="themeLabel">工具栏与界面主题</span>
          <p class="hint" data-i18n="themeHint">默认跟随系统或 Firefox 外观，也可手动固定为浅色或深色磨砂风格。</p>
        </div>
        <div id="theme-switcher" class="segmented" role="radiogroup" aria-label="工具栏与界面主题">
          <button type="button" class="seg-btn is-active" role="radio" aria-checked="true" data-theme-value="system">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="12" rx="2"/>
              <path d="M8 20h8M12 16v4"/>
            </svg>
            <span data-i18n="themeSystem">跟随系统</span>
          </button>
          <button type="button" class="seg-btn" role="radio" aria-checked="false" data-theme-value="light">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 3v2M12 19v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M3 12h2M19 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
            </svg>
            <span data-i18n="themeLight">浅色</span>
          </button>
          <button type="button" class="seg-btn" role="radio" aria-checked="false" data-theme-value="dark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"/>
            </svg>
            <span data-i18n="themeDark">深色</span>
          </button>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2 data-i18n="captureHeading">截图</h2>
      </div>
      <label class="toggle-row" for="hideFloatingElements">
        <div class="toggle-copy">
          <span class="toggle-title" data-i18n="hideFloatingElementsLabel">长截图和整页截图时忽略固定/悬浮元素</span>
          <p class="hint" data-i18n="hideFloatingElementsHint">默认开启。可避免固定搜索栏、悬浮导航、回到顶部按钮等在拼接结果中重复出现或遮住真正内容。</p>
        </div>
        <span class="switch">
          <input id="hideFloatingElements" type="checkbox">
          <span class="slider"></span>
        </span>
      </label>
    </section>

    <section class="card">
      <div class="card-head">
        <h2 data-i18n="shortcutHeading">快捷键</h2>
      </div>
      <label class="field-label" for="shortcut" data-i18n="regionShortcutLabel">区域截图快捷键</label>
      <div class="shortcut-row">
        <input id="shortcut" type="text" readonly placeholder="Alt+Shift+A" autocomplete="off" spellcheck="false">
        <button id="save" type="button" class="btn-primary" data-i18n="saveShortcut">保存</button>
        <button id="reset" type="button" class="secondary" data-i18n="resetShortcut">恢复默认</button>
        <button id="manage-shortcuts" type="button" class="secondary" data-i18n="manageShortcuts">Firefox 快捷键管理</button>
      </div>
      <p class="hint" data-i18n="shortcutHint">点击输入框后直接按下新的组合键。默认 Alt+Shift+A。若与 Firefox 或其他扩展冲突，该快捷键可能不会触发。</p>
      <p id="status" role="status"></p>
    </section>
  </main>
  <script src="options.js"></script>
</body>
</html>

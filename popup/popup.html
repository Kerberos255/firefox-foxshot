<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FoxShot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo">
        <img src="../icons/icon.svg" alt="">
      </div>
      <div class="brand-meta">
        <strong>FoxShot</strong>
        <small data-i18n="popupSubtitle">本地截图工具</small>
      </div>
    </div>
    <button id="open-settings" class="icon-btn" type="button" title="设置" aria-label="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      <span class="sr-only" data-i18n="settings">设置</span>
    </button>
  </header>

  <main class="mode-list">
    <button class="mode-card is-primary" data-mode="region" type="button">
      <span class="mode-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
          <path d="M16 3h3a2 2 0 0 1 2 2v3"/>
          <path d="M8 21H5a2 2 0 0 1-2-2v-3"/>
          <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
          <rect x="7" y="7" width="10" height="10" rx="1.8" stroke-dasharray="2.5 2.5"/>
        </svg>
      </span>
      <div class="mode-copy">
        <div class="mode-title-row">
          <b data-i18n="regionShot">区域截图</b>
          <kbd class="kbd-badge" hidden></kbd>
        </div>
        <small data-i18n="regionHint">框选、调整并标注</small>
      </div>
      <svg class="mode-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 3.5 10.5 8 6 12.5"/>
      </svg>
    </button>

    <button class="mode-card" data-mode="full" type="button">
      <span class="mode-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="3" width="16" height="18" rx="2.5"/>
          <line x1="8" y1="7.5" x2="16" y2="7.5"/>
          <line x1="8" y1="12" x2="16" y2="12"/>
          <line x1="8" y1="16.5" x2="13" y2="16.5"/>
        </svg>
      </span>
      <div class="mode-copy">
        <div class="mode-title-row">
          <b data-i18n="fullShot">整页截图</b>
        </div>
        <small data-i18n="fullHint">固定步长捕获并稳定拼接</small>
      </div>
      <svg class="mode-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 3.5 10.5 8 6 12.5"/>
      </svg>
    </button>

    <button class="mode-card" data-mode="long" type="button">
      <span class="mode-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="3" width="14" height="9" rx="2"/>
          <path d="M12 12v8"/>
          <path d="m8.5 16.5 3.5 3.5 3.5-3.5"/>
          <path d="M5 15.5h2M17 15.5h2" opacity="0.55"/>
        </svg>
      </span>
      <div class="mode-copy">
        <div class="mode-title-row">
          <b data-i18n="longShot">长截图</b>
        </div>
        <small data-i18n="longHint">锁定起点，拖下边缘延伸范围</small>
      </div>
      <svg class="mode-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 3.5 10.5 8 6 12.5"/>
      </svg>
    </button>
  </main>

  <p id="status" role="status"></p>
  <script src="popup.js"></script>
</body>
</html>
